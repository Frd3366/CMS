# Nginx configuration for CTSO Management System (CMS)
# Place in: /etc/nginx/sites-available/cms
# Symlink: ln -s /etc/nginx/sites-available/cms /etc/nginx/sites-enabled/

server {
    listen 8080;
    server_name _;

    root /root/project2/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Security Headers (Hardened)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Frontend Static Build (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # Login Rate Limiting (Mitigate Brute Force Attacks)
    location /api/auth/login {
        # Zone definition: limit_req_zone is loaded via /etc/nginx/conf.d/cms-rate-limit.conf
        limit_req zone=cms_login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI REST Endpoints (/api/)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logs
    access_log /var/log/nginx/cms-access.log;
    error_log /var/log/nginx/cms-error.log;
}
